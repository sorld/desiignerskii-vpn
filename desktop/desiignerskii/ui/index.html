<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; font-src data:; script-src 'unsafe-inline'; style-src 'unsafe-inline'; form-action 'none'; base-uri 'none'"
    />
    <title>Desiignerskii VPN</title>
    <style>
      /* __FONT_LICENSE__ */
      @font-face {
        font-family: Inter;
        src: url(data:font/woff2;base64,__INTER__) format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        font:
          14px/1.45 Inter,
          "Segoe UI",
          system-ui,
          sans-serif;
        color-scheme: light;
        --bg: #fff;
        --ink: #181a19;
        --muted: #575e5b;
        --faint: #6a726e;
        --line: #e2e5e2;
        --well: #f2f4f0;
        --selected: #e6f2cf;
        --accent: #c1ef71;
        --button: #222622;
        --onbutton: #fff;
        --bar: #4d6241;
        --bar2: #b1cf8f;
        --focus: #58882f;
        --error: #a93631;
        --edge: 24px;
        color: var(--ink);
        background: var(--bg);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--bg);
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        background: transparent;
        border: 0;
        cursor: pointer;
        font-weight: 570;
      }
      button:disabled {
        opacity: 0.44;
        cursor: default;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible,
      textarea:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }
      [hidden] {
        display: none !important;
      }
      h1,
      h2,
      p,
      dl,
      dd {
        margin: 0;
      }
      h1,
      h2 {
        font-weight: 600;
        letter-spacing: -0.05em;
        line-height: 1.14;
      }
      svg {
        display: block;
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.65;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      i[data-icon] {
        display: inline-flex;
      }
      .shell {
        width: 100%;
        min-height: 100vh;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        isolation: isolate;
      }
      .head,
      .topnav,
      .pageHead,
      .statTitle,
      .serverTools,
      .device,
      .detailtop,
      .dh,
      .apply,
      #editbar,
      .actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .head {
        min-height: 56px;
        margin: 0 var(--edge);
        border-bottom: 1px solid var(--line);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 17px;
        font-weight: 670;
        letter-spacing: -0.055em;
      }
      .brand img {
        width: 24px;
        height: 24px;
        object-fit: contain;
      }
      .brand small {
        font-size: 9px;
        letter-spacing: 0;
      }
      .head #help {
        margin-left: auto;
      }
      .iconbtn,
      .smallbtn,
      .primary,
      .mode,
      .plain {
        border-radius: 8px;
      }
      .iconbtn {
        width: 32px;
        height: 32px;
        padding: 6px;
        color: var(--muted);
      }
      .iconbtn svg {
        width: 16px;
      }
      .smallbtn,
      .primary {
        padding: 8px 12px;
        min-height: 35px;
        font-size: 12px;
      }
      .smallbtn {
        background: var(--well);
      }
      .primary {
        background: var(--button);
        color: var(--onbutton);
      }
      .iconbtn:hover:enabled,
      .smallbtn:hover:enabled,
      .mode:hover:enabled,
      .plain:hover:enabled {
        background: var(--line);
      }
      .primary:hover:enabled {
        filter: brightness(1.12);
      }
      .topnav {
        order: 5;
        justify-content: space-around;
        gap: 2px;
        padding: 6px 12px;
        background: var(--bg);
        border-top: 1px solid var(--line);
        position: sticky;
        bottom: 0;
        z-index: 2;
      }
      .topnav button {
        flex: 1;
        flex-direction: column;
        gap: 3px;
        color: var(--faint);
        font-size: 10px;
        padding: 5px 3px;
        border-radius: 7px;
      }
      .topnav button svg {
        width: 17px;
        height: 17px;
        order: -1;
      }
      .topnav button[aria-current="page"] {
        color: var(--ink);
        background: var(--well);
      }
      #dashboard {
        padding: 5px var(--edge) 10px;
      }
      .connection {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 3px 13px;
        padding: 24px 0 21px;
      }
      .statusLine {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .statusDot {
        display: block;
        width: 8px;
        height: 8px;
        flex: none;
        border-radius: 50%;
        background: #9ba19d;
      }
      .statusLine strong {
        font-size: clamp(19px, 4vw, 25px);
        font-weight: 590;
        letter-spacing: -0.05em;
        line-height: 1.2;
      }
      .connected .statusDot {
        background: #648b2e;
      }
      .modeLine {
        grid-area: 2/1;
        color: var(--muted);
      }
      .mode {
        min-height: 28px;
        padding: 3px 4px;
        font-size: 11px;
        font-weight: 470;
        color: var(--muted);
        margin-left: -4px;
      }
      .mode svg {
        width: 13px;
        height: 13px;
      }
      .mode i:last-child svg {
        width: 11px;
      }
      .power {
        grid-area: 1/2/3/3;
        width: 64px;
        height: 36px;
        position: relative;
        justify-content: flex-start;
        padding: 3px;
        background: #dfe3dc;
        border: 1px solid #d5dacf;
        border-radius: 22px;
        color: #52594f;
      }
      .power .knob {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: white;
        display: grid;
        place-items: center;
        box-shadow: 0 1px 3px #2223;
        transition: transform 0.18s ease;
      }
      .power .knob svg {
        width: 14px;
        height: 14px;
      }
      .power #powertext {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
      .connected .power {
        background: var(--accent);
        border-color: #b4d878;
      }
      .connected .power .knob {
        transform: translateX(28px);
        color: #2f492b;
      }
      .power:hover:enabled {
        border-color: var(--faint);
      }
      #first {
        grid-column: 1/-1;
        justify-self: start;
        margin-top: 7px;
      }
      .current {
        display: flex;
        align-items: center;
        gap: 13px;
        width: 100%;
        text-align: left;
        background: var(--well);
        border: 1px solid var(--line);
        border-radius: 13px;
        padding: 14px 15px;
        min-height: 79px;
      }
      .current:hover:enabled {
        border-color: var(--faint);
      }
      .current > i {
        margin-left: auto;
        color: var(--muted);
      }
      .current > i svg {
        width: 15px;
      }
      .targetText {
        display: grid;
        row-gap: 1px;
        min-width: 0;
      }
      .targetText small {
        font-size: 10px;
        font-weight: 520;
        color: var(--muted);
      }
      .targetText b {
        font-size: 19px;
        line-height: 1.25;
        letter-spacing: -0.04em;
        font-weight: 590;
        overflow-wrap: anywhere;
      }
      .targetText > span {
        font-size: 12px;
        color: var(--muted);
        font-weight: 430;
      }
      .currentFlag,
      .flag {
        width: 32px;
        height: 32px;
        display: inline-grid;
        place-items: center;
        border-radius: 50%;
        font:
          600 11px/1 Inter,
          sans-serif;
        background: var(--line);
        color: var(--muted);
        flex: none;
      }
      .currentFlag[data-known="true"],
      .flag[data-known="true"] {
        background: var(--flag-bg);
        box-shadow: inset 0 0 0 1px #8882;
      }
      .currentFlag {
        width: 39px;
        height: 39px;
      }
      #stats {
        padding: 22px 0 7px;
      }
      .statTitle h2 {
        font-size: 13px;
        letter-spacing: -0.012em;
      }
      .session {
        margin-left: auto;
        display: inline-flex;
        align-items: center;
        gap: 4px;
        font-size: 11px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .session svg {
        width: 12px;
        height: 12px;
      }
      .trafficBar {
        display: flex;
        gap: 3px;
        margin: 11px 0;
        height: 6px;
        border-radius: 6px;
        overflow: hidden;
        background: var(--well);
      }
      .trafficBar b {
        background: var(--bar);
        flex: var(--received, 0) 1 0;
      }
      .trafficBar i {
        background: var(--bar2);
        flex: var(--sent, 0) 1 0;
      }
      .counters {
        display: flex;
        justify-content: space-between;
      }
      .counters > div {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
      }
      .counters dt,
      .names small,
      .latency {
        color: var(--muted);
        font-size: 11px;
        font-weight: 450;
      }
      .counters dt {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .counters dd {
        font-size: 12px;
        letter-spacing: -0.015em;
        font-variant-numeric: tabular-nums;
      }
      .downMark,
      .upMark {
        width: 6px;
        height: 6px;
        background: var(--bar);
        border-radius: 2px;
      }
      .upMark {
        background: var(--bar2);
      }
      .foot {
        order: 4;
        margin-top: auto;
        padding: 15px var(--edge);
        display: flex;
        align-items: center;
        color: var(--faint);
        font-size: 10px;
        gap: 8px;
      }
      .foot button {
        font-size: 11px;
        padding: 3px 0;
        color: var(--muted);
      }
      .version {
        margin-left: auto;
      }
      .demoTag {
        display: none;
      }
      .demo .demoTag {
        display: inline;
      }
      .workspace,
      #prefs {
        padding: 21px var(--edge);
      }
      .pageHead h1,
      #prefs > h1 {
        font-size: 26px;
      }
      .pageHead button,
      .detailtop button,
      .dh button {
        margin-left: auto;
      }
      .pageHead {
        margin-bottom: 11px;
      }
      .device {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 8px;
        min-height: 27px;
      }
      .device b {
        font-weight: 500;
      }
      .device i svg {
        width: 14px;
      }
      .device .iconbtn {
        height: 25px;
        width: 25px;
      }
      .serverTools {
        padding: 6px 0 10px;
        gap: 7px;
        border-bottom: 1px solid var(--line);
      }
      .filters {
        display: flex;
        gap: 2px;
        padding: 2px;
        background: var(--well);
        border-radius: 7px;
      }
      .filters button {
        font-size: 11px;
        color: var(--muted);
        padding: 5px 7px;
        border-radius: 5px;
      }
      .filters button[aria-pressed="true"] {
        color: var(--ink);
        background: var(--bg);
        box-shadow: 0 1px 3px #0001;
      }
      .find {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 7px;
        margin-left: auto;
        border: 1px solid var(--line);
        border-radius: 7px;
        color: var(--muted);
        min-width: 0;
      }
      .find svg {
        width: 13px;
        height: 13px;
      }
      .find input {
        width: clamp(58px, 15vw, 150px);
        border: 0;
        background: transparent;
        min-width: 0;
        padding: 2px;
        font-size: 11px;
      }
      .server {
        display: flex;
        align-items: stretch;
        gap: 1px;
        border-bottom: 1px solid var(--line);
      }
      .server:hover {
        background: var(--well);
      }
      .pick {
        flex: 1;
        min-width: 0;
        justify-content: flex-start;
        text-align: left;
        padding: 9px 3px;
        gap: 11px;
      }
      .server.sel .pick {
        color: var(--ink);
      }
      .sel .names b:after {
        content: "";
        background: var(--focus);
        display: inline-block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        margin: 0 0 2px 7px;
      }
      .names {
        display: grid;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .names b {
        font-weight: 570;
        font-size: 13px;
      }
      .latency {
        margin-left: auto;
        white-space: nowrap;
      }
      .star {
        width: 29px;
        color: var(--faint);
      }
      .star svg {
        width: 15px;
      }
      .star.saved {
        color: var(--focus);
      }
      .star.saved svg {
        fill: var(--selected);
      }
      .zero,
      .note,
      .explain {
        font-size: 12px;
        color: var(--muted);
      }
      .zero {
        padding: 15px 0;
      }
      #prefs > h1 {
        margin-bottom: 16px;
      }
      .prefslayout {
        display: block;
      }
      #categories {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 14px;
      }
      #categories button {
        min-height: 29px;
        border-radius: 7px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 530;
        padding: 5px 7px;
      }
      #categories button[aria-current="page"] {
        color: var(--ink);
        background: var(--selected);
      }
      #categories svg {
        width: 14px;
      }
      .detail {
        min-width: 0;
      }
      .detailtop h2 {
        font-size: 20px;
      }
      .detailtop {
        padding-bottom: 7px;
      }
      .field {
        padding: 12px 0;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .field label {
        font-size: 12px;
        font-weight: 550;
        display: block;
      }
      .field small,
      .note,
      .explain {
        display: block;
        font-size: 11px;
        line-height: 1.5;
        color: var(--muted);
      }
      .field small {
        margin-top: 2px;
      }
      .in,
      select,
      textarea,
      .input {
        min-width: 0;
        max-width: 100%;
        font-size: 12px;
        border: 1px solid var(--line);
        background: var(--well);
        border-radius: 7px;
        padding: 8px 9px;
      }
      .field .in {
        width: clamp(125px, 24vw, 220px);
      }
      .field input[type="number"] {
        width: 72px;
      }
      .switch {
        position: relative;
        width: 34px;
        height: 20px;
        flex: none;
        border-radius: 13px;
        background: var(--faint);
      }
      .switch:before {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        border-radius: 50%;
        width: 14px;
        height: 14px;
        background: white;
      }
      .switch[aria-checked="true"] {
        background: #5c8037;
      }
      .switch[aria-checked="true"]:before {
        left: 17px;
      }
      .field.area {
        display: block;
      }
      .area textarea {
        display: block;
        width: 100%;
        margin-top: 5px;
        resize: vertical;
        font:
          12px/1.5 Consolas,
          monospace;
      }
      .note,
      .explain {
        margin: 9px 0;
      }
      .note:empty,
      .error:empty,
      .message:empty {
        display: none;
      }
      .error {
        font-size: 12px;
        color: var(--error);
      }
      .globalError {
        padding: 0 var(--edge) 9px;
      }
      .message {
        color: var(--focus);
        font-size: 12px;
        margin: 9px 0;
      }
      .apply,
      #editbar,
      .actions {
        flex-wrap: wrap;
      }
      .apply,
      #editbar {
        margin-top: 10px;
      }
      .apply {
        font-size: 12px;
      }
      .builder {
        background: var(--well);
        padding: 12px;
        margin: 9px 0;
        border-radius: 9px;
      }
      .builder-controls {
        display: flex;
        align-items: end;
        flex-wrap: wrap;
        gap: 7px;
      }
      .builder label {
        display: flex;
        flex-direction: column;
        gap: 3px;
        font-size: 10px;
        color: var(--muted);
        flex: 1 1 105px;
      }
      .builder input,
      .builder select {
        width: 100%;
        background: var(--bg);
      }
      .logs {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 200px;
        overflow: auto;
        background: var(--well);
        padding: 11px;
        border-radius: 7px;
        font:
          12px/1.5 Consolas,
          monospace;
      }
      dialog {
        width: min(410px, calc(100% - 28px));
        border: 1px solid var(--line);
        background: var(--bg);
        color: var(--ink);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 14px 50px #0003;
      }
      dialog::backdrop {
        background: #14171776;
      }
      .dh h2 {
        font-size: 21px;
      }
      #url {
        display: block;
        width: 100%;
        margin: 5px 0 13px;
      }
      #form label {
        font-size: 12px;
        font-weight: 560;
      }
      .modeChoice {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 6px;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        margin: 6px 0;
        width: 100%;
      }
      .modeChoice small {
        color: var(--muted);
        font-weight: 400;
        grid-column: 1;
      }
      .modeChoice i {
        grid-area: 1/2/3/3;
        align-self: center;
        visibility: hidden;
      }
      .modeChoice[aria-pressed="true"] {
        background: var(--selected);
      }
      .modeChoice[aria-pressed="true"] i {
        visibility: visible;
      }
      #dialogerr {
        margin-top: 7px;
      }
      body.wide {
        color-scheme: dark;
        --bg: #1b1c1e;
        --ink: #f0f1ef;
        --muted: #b3b5b1;
        --faint: #a2a5a2;
        --line: #393b3d;
        --well: #27292b;
        --selected: #34452d;
        --button: #c5ef8c;
        --onbutton: #1b2417;
        --bar: #c1e69c;
        --bar2: #738168;
        --focus: #c7f196;
        --error: #ffbfae;
        --edge: clamp(18px, 3.2vw, 39px);
      }
      .wide .shell {
        position: relative;
      }
      .wide .head {
        min-height: 57px;
      }
      .wide .topnav {
        order: 0;
        position: absolute;
        top: 0;
        right: calc(var(--edge) + 49px);
        height: 56px;
        padding: 0;
        border: 0;
        justify-content: flex-end;
        gap: 12px;
        background: transparent;
      }
      .wide .topnav button {
        font-size: 12px;
        line-height: 1;
        min-height: 32px;
        min-width: 88px;
        flex-direction: row;
        gap: 6px;
        padding: 7px 9px;
      }
      .wide .topnav button svg {
        width: 14px;
      }
      .wide .connection {
        padding: 15px 0;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
      }
      .wide .statusLine strong {
        font-size: 22px;
      }
      .wide .modeLine {
        grid-area: 1/2;
      }
      .wide .power {
        grid-area: 1/3;
        border: 0;
        width: auto;
        height: 34px;
        padding: 5px 12px;
        background: var(--button);
        border-radius: 8px;
        color: var(--onbutton);
      }
      .wide .power .knob {
        width: auto;
        height: auto;
        box-shadow: none;
        background: transparent;
        transform: none;
        color: inherit;
      }
      .wide .power #powertext {
        position: static;
        width: auto;
        height: auto;
        clip-path: none;
        font-size: 12px;
      }
      .wide.connected .power {
        background: var(--well);
        color: var(--ink);
      }
      .wide #first {
        grid-area: 1/3;
        margin: 0;
      }
      .wide .readouts {
        display: grid;
        grid-template-columns: minmax(190px, 0.85fr) minmax(210px, 1fr);
        gap: 25px;
        align-items: center;
        padding: 9px 15px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #232527;
      }
      .wide .current {
        justify-content: flex-start;
        border: 0;
        background: transparent;
        padding: 0;
        min-height: 53px;
        border-radius: 4px;
      }
      .wide .currentFlag {
        width: 32px;
        height: 32px;
      }
      .wide .current i {
        display: none;
      }
      .wide .targetText {
        column-gap: 8px;
        grid-template-columns: auto 1fr;
        align-items: baseline;
      }
      .wide .targetText small {
        grid-column: 1/-1;
      }

    <script>

      function icon(name) {

      const modes = { tun: "Полный туннель", proxy: "Системный прокси" };
      const init = {

        busy: false,
        groups: [{ id: 1, name: "Мой компьютер" }],
        selected: 4,
        favorites: [4],
        nodes: [
          {
            id: 4,
            group: 1,
            name: "Нидерланды · Амстердам",
            country: "NL",
            latency: 38,
            down: 242221056,
            up: 11734951,
          },
          {
            id: 5,
            group: 1,
            name: "Германия · Франкфурт",
            country: "DE",
            latency: 47,
            down: 0,
            up: 0,
          },
          {
            id: 6,
            group: 1,
            name: "Финляндия · Хельсинки",
            country: "FI",
            latency: 56,
            down: 0,
            up: 0,
          },
          {
            id: 7,
            group: 1,
            name: "Швеция · Стокгольм",
            country: "SE",
            latency: 62,
            down: 0,
            up: 0,

      let s = { ...init },
        favOnly = false,
        shownGroup = null,
        panel = "",
        pending = "",
        sending = false,
        dirty = "",
        groupSig = "";
      if (demo) document.body.classList.add("demo");
      function txt(id, value) {
        if ($(id).textContent !== value) $(id).textContent = value;
      }
      function duration(seconds) {
        const n = Math.max(0, seconds | 0);
        return [Math.floor(n / 3600), Math.floor(n / 60) % 60, n % 60]
          .map((v) => String(v).padStart(2, "0"))
          .join(":");
      }
      function bytes(n) {
        let v = Number(n) || 0,
          i = 0;
        const u = ["Б", "КБ", "МБ", "ГБ", "ТБ"];
        while (v >= 1024 && i < u.length - 1) {
          v /= 1024;
          i++;
        }
        return (
          new Intl.NumberFormat("ru", {
            maximumFractionDigits: i ? 1 : 0,
          }).format(v) +
          " " +
          u[i]
        );
      }
      function elem(tag, cls, value) {
        let e = document.createElement(tag);
        e.className = cls;
        if (value !== undefined) e.textContent = value;
        return e;
      }
      const regionNames = new Map();
      for (const locale of ["ru", "en"]) {
        const names = new Intl.DisplayNames([locale], { type: "region" });
        for (const code of "AD AE AF AG AI AL AM AO AQ AR AS AT AU AW AX AZ BA BB BD BE BF BG BH BI BJ BL BM BN BO BQ BR BS BT BV BW BY BZ CA CC CD CF CG CH CI CK CL CM CN CO CR CU CV CW CX CY CZ DE DJ DK DM DO DZ EC EE EG EH ER ES ET FI FJ FK FM FO FR GA GB GD GE GF GG GH GI GL GM GN GP GQ GR GS GT GU GW GY HK HM HN HR HT HU ID IE IL IM IN IO IQ IR IS IT JE JM JO JP KE KG KH KI KM KN KP KR KW KY KZ LA LB LC LI LK LR LS LT LU LV LY MA MC MD ME MF MG MH MK ML MM MN MO MP MQ MR MS MT MU MV MW MX MY MZ NA NC NE NF NG NI NL NO NP NR NU NZ OM PA PE PF PG PH PK PL PM PN PR PS PT PW PY QA RE RO RS RU RW SA SB SC SD SE SG SH SI SJ SK SL SM SN SO SR SS ST SV SX SY SZ TC TD TF TG TH TJ TK TL TM TN TO TR TT TV TW TZ UA UG UM US UY UZ VA VC VE VG VI VN VU WF WS YE YT ZA ZM ZW".split(
          " ",
        ))
          regionNames.set(names.of(code).toLocaleLowerCase(locale), code);
      }
      function countryFor(node) {
        if (!node) return "";
        const measured = (node.country || "").toUpperCase();
        if (/^[A-Z]{2}$/.test(measured)) return measured;
        const flag = node.name.match(/[\u{1f1e6}-\u{1f1ff}]{2}/u);
        if (flag)
          return Array.from(flag[0], (c) =>
            String.fromCharCode(65 + c.codePointAt(0) - 0x1f1e6),
          ).join("");
        const first = node.name.split(/\s+[·•|—–-]\s+/)[0].trim();
        return regionNames.get(first.toLocaleLowerCase()) || "";
      }
      const flagFills = {
        NL: "linear-gradient(#bc474d 0 33.33%,#f2efe9 33.33% 66.66%,#47649a 66.66%)",
        DE: "linear-gradient(#212625 0 33.33%,#c95050 33.33% 66.66%,#ebc357 66.66%)",
        FI: "linear-gradient(90deg,transparent 31%,#365994 31% 50%,transparent 50%),linear-gradient(#e6ece8 39%,#365994 39% 58%,#e6ece8 58%)",
        SE: "linear-gradient(90deg,transparent 32%,#f1c653 32% 48%,transparent 48%),linear-gradient(#34749b 39%,#f1c653 39% 56%,#34749b 56%)",
      };
      function setFlag(element, code) {
        if (element.dataset.region === code) return;
        element.dataset.region = code;
        element.dataset.known = String(Boolean(flagFills[code]));
        element.style.setProperty(
          "--flag-bg",
          flagFills[code] || "transparent",

        if (!flagFills[code]) {
          if (code) element.textContent = code;
          else element.append(icon("globe"));

      }
      function row(n, locked) {
        const chosen = n.id === s.selected,
          starred = (s.favorites || []).includes(n.id),
          container = elem("div", "server" + (chosen ? " sel" : "")),
          pick = elem("button", "pick");

        pick.onclick = () => act("select", "", n.id);
        const flag = elem("span", "flag");

        const names = elem("span", "names"),

        if (parts.length > 1)
          names.append(elem("small", "", parts.slice(1).join(" · ")));

          "span",
          "latency",
          n.latency > 0
            ? n.latency + " мс"
            : n.latency < 0
              ? "Нет ответа"
              : "—",

          n.latency > 0
            ? "Задержка по последнему тесту"
            : n.latency < 0
              ? "Сервер не ответил на тест"
              : "Задержка ещё не измерена";

        const star = elem("button", "star" + (starred ? " saved" : ""));
        star.disabled = locked;
        star.append(icon("star"));
        star.setAttribute("aria-pressed", String(starred));
        star.setAttribute(
          "aria-label",
          (starred ? "Убрать из избранных: " : "В избранные: ") + n.name,
        );

        return container;

      function paint() {
        const nodes = s.nodes || [],
          gs = s.groups || [],
          selected = nodes.find((n) => n.id === s.selected),
          empty = !nodes.length,
          locked = s.busy || sending,
          initial = s.state === "starting",
          broken = s.state === "error";
        const gsNow = JSON.stringify(gs);
        if (groupSig !== gsNow) {
          groupSig = gsNow;
          $("group").replaceChildren(
            ...gs.map((g) => {
              const opt = document.createElement("option");
              opt.value = g.id;
              opt.textContent = g.name;
              return opt;
            }),
          );
          if (!gs.some((g) => g.id === shownGroup))
            shownGroup = selected?.group ?? gs[0]?.id ?? null;
        }
        $("devices").hidden = !gs.length;
        $("group").hidden = gs.length <= 1;
        $("dname").hidden = gs.length > 1;
        txt("dname", gs[0]?.name || "");
        $("group").value = String(shownGroup);
        $("update").disabled = locked || s.active;
        $("group").disabled = locked;

        $("favs").setAttribute("aria-pressed", String(favOnly));

          nodes.map((n) => [n.id, n.name, n.group, n.country, n.latency]),
          s.favorites,
          s.selected,
          query,
          favOnly,
          shownGroup,
          locked,
        ]);
        if (dirty !== sig) {
          dirty = sig;
          const list = nodes.filter(
            (n) =>
              (shownGroup === null || shownGroup === n.group) &&
              (!favOnly || (s.favorites || []).includes(n.id)) &&
              n.name.toLocaleLowerCase("ru").includes(query),
          );

            "zero",
            initial
              ? "Загрузка серверов…"
              : empty
                ? "Добавь ссылку устройства, чтобы увидеть его серверы."
                : query
                  ? "Ничего не найдено."

      function ruleBuilder() {

        box.onsubmit = (event) => {
          event.preventDefault();
          const raw = value.value.trim();
          let entry = "";
          if (kind.value === "site") {
            try {
              const host = new URL("https://" + raw).hostname;
              if (
                !host ||
                /[\s/:@?#\\]/.test(raw) ||
                !host.includes(".") ||
                host
                  .split(".")
                  .some(
                    (p) => !/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/i.test(p),
                  )
              )

              entry = "suffix:" + host;
            } catch {
              value.setCustomValidity("Введи домен, например example.org.");

            }
          } else {
            if (!/^[^\\/:*?"<>|\r\n]+\.exe$/i.test(raw)) {
              value.setCustomValidity(
                "Введи имя файла программы, например app.exe.",
              );
              value.reportValidity();
              return;
            }
            entry = "processName:" + raw;

          const el = $(output.value),
            lines = el.value.split(/\r?\n/);
          if (lines.some((line) => line.trim() === entry)) {
            value.setCustomValidity("Это правило уже есть в списке.");
            value.reportValidity();
            return;
          }
          el.value = [el.value.trimEnd(), entry].filter(Boolean).join("\n");
          setValue(output.value, el.value);
          value.value = "";
          value.focus();
        };
        return box;
      }

                "button",
                "smallbtn log-action",
                s.logs ? "Обновить журнал" : "Открыть журнал",
              );
              read.dataset.lock = "";
              read.onclick = () => act("logs");
              area.append(read);
              if (s.logs) {
                const log = elem(
                  "pre",
                  "logs",
                  s.logs
                    .map(
                      (l) =>
                        new Date(l.time * 1000).toLocaleTimeString("ru") +
                        "  " +
                        l.text,
                    )
                    .join("\n") || "Записей пока нет.",
                );
                log.tabIndex = 0;
                area.append(log);
              }
            }
          }
          for (const item of $("categories").children) {
            if (item.dataset.section === section)
              item.setAttribute("aria-current", "page");
            else item.removeAttribute("aria-current");
          }
        }
        syncBar();
      }
      function loadSection(force = false) {
        if (s.busy || sending || s.state === "starting" || s.state === "error")
          return;
        const op = section === "routes" ? "routes" : "settings";
        if (
          force ||
          ((op === "routes" ? s.routes == null : s.settings == null) &&
            lastLoad !== op)
        ) {
          lastLoad = op;
          act(op, "", op === "routes" && s.editor ? s.editor.id : -1);
        }
      }
      function showPage(name) {
        prefsOpen = name === "settings";
        $("dashboard").hidden = prefsOpen;
        $("serverPage").hidden = prefsOpen;
        $("prefs").hidden = !prefsOpen;
        for (const key of ["home", "settings"]) {
          if (name === key) $(key).setAttribute("aria-current", "page");
          else $(key).removeAttribute("aria-current");
        }
        $("notice").hidden = prefsOpen;
      }
      function showPrefs(which = section) {
        section = which;
        showPage("settings");
        localError = "";
        noticeText = "";
        renderKey = "";
        fillPrefs();
        loadSection();
      }
      for (const [id, [title, symbol]] of Object.entries(sections)) {
        const b = elem("button", "");
        b.dataset.section = id;
        b.append(icon(symbol), document.createTextNode(title));
        b.onclick = () => showPrefs(id);
        $("categories").append(b);
      }
      $("home").onclick = () => showPage("home");
      $("chooseServer").onclick = () => {
        $("search").focus();
        $("search").select();
      };
      $("settings").onclick = () => showPrefs();
      $("reloadPrefs").onclick = () => {
        noticeText = "";
        localError = "";
        loadSection(true);
      };
      $("reset").onclick = () => {
        if (section === "routes") {
          delete routeDrafts[s.editor.id];
          delete ruleBases[s.editor.id];
        } else delete drafts[section];
        localError = "";
        noticeText = "";
        renderKey = "";
        fillPrefs();
      };
      $("save").onclick = () => {
        for (const el of $("prefFields").querySelectorAll("input")) {
          if (!Object.hasOwn(scopedDraft(), el.id)) continue;
          if (
            ["sub_auto_update", "route_auto_update"].includes(el.id) &&
            Number(el.value) > 0 &&
            Number(el.value) < 30
          )
            el.setCustomValidity("Укажи 0 или интервал от 30 минут.");
          if (el.id === "test_url" && !/^https?:\/\//i.test(el.value))
            el.setCustomValidity("Укажи адрес HTTP или HTTPS.");
          if (!el.reportValidity()) return;
        }
        if (section === "routes") {
          const id = s.editor.id,
            before = {};
          for (const k of Object.keys(scopedDraft()))
            before[k] = ruleBases[id][k];
          act(
            "save-rules",
            JSON.stringify({ before, after: scopedDraft() }),
            id,
          );
        } else act("save-settings", JSON.stringify(scopedDraft()));
      };
      $("reconnect").onclick = () => act("reconnect");
      function didFinish(op) {
        if (op === "save-settings" || op === "save-rules") {
          if (op === "save-rules") {
            delete routeDrafts[s.editor.id];
            delete ruleBases[s.editor.id];
          } else delete drafts[section];
          noticeText = "Изменения сохранены.";
          renderKey = "";
        } else if (op === "reconnect") noticeText = "Соединение обновлено.";
      }
      function demoAdvanced(op, arg, id) {
        if (op === "settings") {
          sample.settings = { ...exampleSettings };
        }
        if (op === "save-settings") {
          const changes = JSON.parse(arg);
          Object.assign(exampleSettings, changes);
          sample.settings = { ...exampleSettings };
          if (
            sample.active &&
            Object.keys(changes).some((k) =>
              /^(tun_|remote_dns|direct_dns|dns_in_port|log_level)/.test(k),
            )
          )
            sample.restart = true;
        }
        if (op === "activate-route")
          previewRoutes.forEach((r) => (r.active = r.in_use = r.id === id));
        if (op === "save-rules") {
          Object.assign(exampleRules[id], JSON.parse(arg).after);
          if (
            sample.active &&
            previewRoutes.some((r) => r.id === id && r.in_use)
          )
            sample.restart = true;
        }
        if (["routes", "activate-route", "save-rules"].includes(op)) {
          sample.routes = previewRoutes.map((r) => ({ ...r }));
          if (id < 0) id = previewRoutes.find((r) => r.active).id;
          sample.editor = {
            id,
            editable: true,
            simple: { ...exampleRules[id] },
          };
        }
        if (op === "reconnect") {
          sample.since = Math.floor(Date.now() / 1000);
          sample.restart = false;
        }
        if (op === "disconnect" || op === "connect") sample.restart = false;
        if (op === "logs") {
          sample.logs = [
            {
              time: Math.floor(Date.now() / 1000),
              text: "Демонстрационный журнал. В приложении здесь появятся записи Throne.",
            },
          ];
        }
        if (
          ["save-rules", "save-settings", "mode", "activate-route"].includes(op)
        )
          storeExample();
      }

      showPage("home");
      paint();
      (async function tick() {
        await refresh();
        if (prefsOpen) loadSection();
        setTimeout(tick, 430);
      })();
    </script>
  </body>
</html>
